# Double DQN with counterfactual reward-machine experiences (PR #31's double_dqn.yaml).
ALG: RM_DQN
EXP_NAME: rm_dqn

PIXEL_BASED: False # reward machines label events from the object-centric observation
NATIVE_DOWNSCALING: True

TOTAL_TIMESTEPS: 9_932_800
NUM_ENVS: 2048
SCAN_STEPS: 50 # updates per jitted chunk

USE_CRM: True # one experience per RM state from every env step
# potential-based shaping comes from RM_SHAPING in config.yaml
LEARNING_RATE: 2.5e-4
ANNEAL_LR: False
MAX_GRAD_NORM: 10.0
GAMMA: 0.99

BUFFER_SIZE: 500_000
BATCH_SIZE: 512
LEARNING_STARTS: 20_000
TRAIN_FREQUENCY: 1 # env steps (per env) between updates
GRADIENT_STEPS: 32 # gradient steps per update
TARGET_NETWORK_FREQUENCY: 24_576 # env steps; = 12 updates x 2048 envs, i.e. every ~375 gradient steps
TAU: 1.0

START_E: 1.0
END_E: 0.05
EXPLORATION_FRACTION: 0.302 # epsilon reaches END_E after 3M env steps
