ALG: PPO_CRL
EXP_NAME: ppo_crl

CAPTURE_VIDEO: False
VIDEO_AT_END: True  # True: capture videos only at the end of training on a task

EVAL_DURING_TRAIN: True
EVAL_EVERY: 102
EVAL_EPISODES: 100  # per seen task; BWT/FM are differences of evals (other agents use 10)

PIXEL_BASED: False
NATIVE_DOWNSCALING: True

LEARNING_RATE: 0.00025
NUM_ENVS: 512
NUM_STEPS: 64
SCAN_STEPS: 1  # updates per jitted chunk (one wandb log per update)
ANNEAL_LR: True
GAMMA: 0.99
GAE_LAMBDA: 0.95
NUM_MINIBATCHES: 8
UPDATE_EPOCHS: 4
NORM_ADV: True
CLIP_COEF: 0.1
ENT_COEF: 0.01
VF_COEF: 0.5
MAX_GRAD_NORM: 0.5

# =================================================================
# CL Specific Configs
# =================================================================

TASKS: [seaquest, seaquest, seaquest] # replaces ENV_ID
TIMESTEPS_PER_TASK: 10000000  # replaces TOTAL_TIMESTEPS

# mods applied during training, one list per task
TASK_TRAIN_MODS: 
  - []
  - [unlimited_oxygen]
  - [no_divers]

# mod lists each task is evaluated on (default: its train mods)
TASK_EVAL_MODS: 
  - [ [] ]
  - [ [unlimited_oxygen] ]
  - [ [no_divers] ]

CL_METHOD: ewc  # none, ewc, agem, packnet

# EWC
EWC_DECAY: 0.9  # Decay for Online EWC
EWC_LAMBDA: 1000000.0  # Weight for EWC penalty

# AGEM
SAMPLES_PER_TASK: 256  # Samples to store in the memory buffer per task
AGEM_MINIBATCH_SIZE: 256

# PackNet
PRUNE_ITERATION_FRAC: 0.66  # Percentage of training at which the PackNet pruning is performed
