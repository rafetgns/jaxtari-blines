# experiment params
NAME_INITIALS: "RE"
NUM_SEEDS: 3
SEED: 1

# wandb params
WANDB_MODE: "online"  # set to online to activate wandb
ENTITY: "jaxatari"
PROJECT: "jaxtari-blines-cameraready"

# where to save the params (if None, will not save)
SAVE_PATH: "./models"
# upload the final checkpoint to wandb as a model artifact (needs SAVE_PATH)
WANDB_SAVE_MODEL: False
# upload to huggingface
UPLOAD_MODEL: False

# default env
ENV_ID: pong

# choose mods to be active during training, default: None
TRAIN_MODS: []
# choose mods to be evaluated after training
EVAL_MODS: []

# eval every N steps during training
EVAL_DURING_TRAIN: False
EVAL_EVERY: 100 # measured in alg iterations, not env steps
# whether to capture a video during eval
CAPTURE_VIDEO: True
# cap on the eval video length in frames (null = whole first episode); encoding is CPU-bound
VIDEO_MAX_FRAMES: null

# conv encoder for pixel-based runs: "nature" (Mnih et al., 2015) or "impala" (Espeholt et al., 2018); ignored for OC
CNN_TYPE: nature

# OCCAM (Blüml et al., 2025) for pixel-based runs: object masks instead of frames.
# null = plain frames, or one of binary | object | class | planes; ignored for OC
OCCAM_MASK: null

# reward machines (Toro Icarte et al., 2018) for object-centric runs: the game's RM
# (reward_machines/) pays the reward and its state is appended to the observation;
# evaluation still scores the game reward. RM_SHAPING adds potential-based shaping.
REWARD_MACHINE: False
RM_SHAPING: False
